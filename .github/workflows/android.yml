name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Новая загрузка отменяет ещё идущую старую сборку.
concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    # Версия сервера закреплена: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26.
    runs-on: ubuntu-24.04
    # Сборка занимает пару минут. Всё, что дольше 20, — зависание, а не работа.
    timeout-minutes: 20

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже стоит на серверах GitHub. Сторонний модуль не нужен —
      # он и сломал сборку №2. Ставим сами только то, чего не хватает.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK"
          fi
          echo "SDK: $SDK"

          SDKM=""
          for c in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          if [ -z "$SDKM" ]; then
            echo "Командных инструментов нет — ставлю"
            curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          SUDO=""
          if [ ! -w "$SDK" ]; then SUDO="sudo -E"; fi

          if [ ! -d "$SDK/platform-tools" ] || ! ls -d "$SDK"/build-tools/*/ > /dev/null 2>&1; then
            yes | $SUDO "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            $SUDO "$SDKM" --sdk_root="$SDK" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          fi

          echo "build-tools на сервере:"; ls "$SDK/build-tools"
          test -x "$SDK/platform-tools/adb" || { echo "Нет adb"; exit 1; }
          ls "$SDK"/build-tools/*/apksigner > /dev/null || { echo "Нет apksigner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Godot ${{ env.GODOT_VERSION }} и шаблоны экспорта
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sfL -o tpl.tpz   "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          unzip -q tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Постоянный отладочный ключ — чтобы новые сборки ставились поверх старых
        id: keycache
        uses: actions/cache@v5
        with:
          path: ~/debug.keystore
          key: pustite-debug-keystore-v1

      - name: Отладочный ключ подписи (создаётся один раз)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12 -noprompt

      - name: Настройки редактора Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Проверка комплектности папки game
        run: |
          cd game
          if [ ! -f MANIFEST.txt ] || [ ! -f scripts/boot.gd ]; then
            echo "::error title=Старая папка game::В game нет MANIFEST.txt или scripts/boot.gd — загружена старая версия. Удалите папку game на GitHub и загрузите её из последнего архива."
            exit 1
          fi
          grep -v '^#' MANIFEST.txt | sort > /tmp/expected.txt
          find . -type f \( -name "*.gd" -o -name "*.tscn" -o -name "*.gdshader" -o -name "*.tres" -o -name "project.godot" -o -name "export_presets.cfg" \) ! -path "./.godot/*" | sed 's#^\./##' | sort > /tmp/actual.txt
          extra=$(comm -13 /tmp/expected.txt /tmp/actual.txt)
          missing=$(comm -23 /tmp/expected.txt /tmp/actual.txt)
          if [ -n "$extra" ]; then
            echo "::error title=Лишние файлы в game::Остались от старой версии: $(echo $extra). Удалите папку game на GitHub и загрузите её заново целиком."
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Не хватает файлов в game::Не загрузились: $(echo $missing). Загрузите папку game заново целиком."
          fi
          [ -z "$extra" ] && [ -z "$missing" ] || exit 1
          for flag in sim flow layout lifecycle field crowd bubbles marks input hints difficulty howto; do
            grep -q -- "\"--$flag\"" scripts/boot.gd || { echo "::error::В scripts/boot.gd нет режима --$flag."; exit 1; }
          done
          echo "Комплект совпадает с описью: $(wc -l < /tmp/expected.txt) файлов"

      - name: Импорт ресурсов
        run: |
          godot --headless --path game --import
          godot --headless --path game --import

      - name: Самотест баланса и грамматики (3000 партий, коридор 30–70%)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --sim 2>&1 | tee /tmp/sim.log
          if grep -q "SCRIPT ERROR" /tmp/sim.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --sim в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест экранов (обе роли у двери обязательны)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --flow 2>&1 | tee /tmp/flow.log
          if grep -q "SCRIPT ERROR" /tmp/flow.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --flow в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест раскладки (7 типов экранов, вырезы, кнопки от 48 dp)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --layout 2>&1 | tee /tmp/layout.log
          if grep -q "SCRIPT ERROR" /tmp/layout.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --layout в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест жизненного цикла (сворачивание, «Назад», экран)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --lifecycle 2>&1 | tee /tmp/lifecycle.log
          if grep -q "SCRIPT ERROR" /tmp/lifecycle.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --lifecycle в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест игрового поля (посёлок, туман, 30 fps в покое)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --field 2>&1 | tee /tmp/field.log
          if grep -q "SCRIPT ERROR" /tmp/field.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --field в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест толпы (5–12 жителей, днём и ночью, имена читаются)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --crowd 2>&1 | tee /tmp/crowd.log
          if grep -q "SCRIPT ERROR" /tmp/crowd.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --crowd в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест пузырей реплик (не налезают, видны над говорящим)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --bubbles 2>&1 | tee /tmp/bubbles.log
          if grep -q "SCRIPT ERROR" /tmp/bubbles.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --bubbles в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест живого поля (тап по жителю, глаз, улики, уговор)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --marks 2>&1 | tee /tmp/marks.log
          if grep -q "SCRIPT ERROR" /tmp/marks.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --marks в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест ввода (быстрые фразы, клавиатура не закрывает поле)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --input 2>&1 | tee /tmp/input.log
          if grep -q "SCRIPT ERROR" /tmp/input.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --input в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест подсказок (три штуки, исчезают после действия)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --hints 2>&1 | tee /tmp/hints.log
          if grep -q "SCRIPT ERROR" /tmp/hints.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --hints в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест сложности (лёгкий старт, предложение после партии, метка «Вы»)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --difficulty 2>&1 | tee /tmp/difficulty.log
          if grep -q "SCRIPT ERROR" /tmp/difficulty.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --difficulty в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Самотест «Как играть» (один раз перед первой партией, повтор из меню)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game -- --howto 2>&1 | tee /tmp/howto.log
          if grep -q "SCRIPT ERROR" /tmp/howto.log; then
            echo "::error title=Ошибки скриптов::Во время самотеста --howto в логе есть SCRIPT ERROR — см. выше."
            exit 1
          fi

      - name: Экспорт APK
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Android" "$PWD/build/pustite.apk"
          ls -la build/
          test -s build/pustite.apk || { echo "APK не создан"; exit 1; }

      - name: Положить APK в артефакты
        uses: actions/upload-artifact@v5
        with:
          name: pustite-apk
          path: build/pustite.apk
          retention-days: 30

      - name: Выложить релиз со ссылкой на APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          VER=$(grep -oP 'config/version="\K[^"]+' game/project.godot || echo "?")
          gh release create "$TAG" "build/pustite.apk" \
            --title "v$VER · $TAG" \
            --notes "Отладочная сборка. Коммит ${GITHUB_SHA::7}. Скачайте pustite.apk и установите на телефон." \
            --latest
