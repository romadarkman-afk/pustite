name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    # Версия сервера закреплена: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26.
    runs-on: ubuntu-24.04
    # Сборка занимает пару минут. Всё, что дольше 20, — зависание, а не работа.
    timeout-minutes: 20

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже стоит на серверах GitHub. Сторонний модуль не нужен —
      # он и сломал сборку №2. Ставим сами только то, чего не хватает.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK"
          fi
          echo "SDK: $SDK"

          SDKM=""
          for c in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          if [ -z "$SDKM" ]; then
            echo "Командных инструментов нет — ставлю"
            curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          SUDO=""
          if [ ! -w "$SDK" ]; then SUDO="sudo -E"; fi

          if [ ! -d "$SDK/platform-tools" ] || ! ls -d "$SDK"/build-tools/*/ > /dev/null 2>&1; then
            yes | $SUDO "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            $SUDO "$SDKM" --sdk_root="$SDK" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          fi

          echo "build-tools на сервере:"; ls "$SDK/build-tools"
          test -x "$SDK/platform-tools/adb" || { echo "Нет adb"; exit 1; }
          ls "$SDK"/build-tools/*/apksigner > /dev/null || { echo "Нет apksigner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Godot ${{ env.GODOT_VERSION }} и шаблоны экспорта
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sfL -o tpl.tpz   "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          unzip -q tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Постоянный отладочный ключ — чтобы новые сборки ставились поверх старых
        id: keycache
        uses: actions/cache@v5
        with:
          path: ~/debug.keystore
          key: pustite-debug-keystore-v1

      - name: Отладочный ключ подписи (создаётся один раз)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12 -noprompt

      - name: Настройки редактора Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Проверка, что код в game свежий
        run: |
          for flag in sim flow layout; do
            if ! grep -q -- "\"--$flag\"" game/scripts/app.gd; then
              echo "::error title=Старая папка game::В game/scripts/app.gd нет режима --$flag. Похоже, загружена старая папка game. Загрузите game из последнего архива."
              exit 1
            fi
          done
          echo "Код свежий: режимы sim, flow, layout на месте"

      - name: Импорт ресурсов
        run: |
          godot --headless --path game --import
          godot --headless --path game --import

      - name: Самотест баланса (3000 партий, коридор 30–70%)
        timeout-minutes: 5
        run: timeout 300 godot --headless --path game -- --sim

      - name: Самотест экранов (обе роли у двери обязательны)
        timeout-minutes: 5
        run: timeout 300 godot --headless --path game -- --flow

      - name: Самотест раскладки (5 типов экранов, кнопки от 48 dp)
        timeout-minutes: 5
        run: timeout 300 godot --headless --path game -- --layout

      - name: Экспорт APK
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Android" "$PWD/build/pustite.apk"
          ls -la build/
          test -s build/pustite.apk || { echo "APK не создан"; exit 1; }

      - name: Положить APK в артефакты
        uses: actions/upload-artifact@v5
        with:
          name: pustite-apk
          path: build/pustite.apk
          retention-days: 30

      - name: Выложить релиз со ссылкой на APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "build/pustite.apk" \
            --title "Сборка $TAG" \
            --notes "Отладочная сборка. Коммит ${GITHUB_SHA::7}. Скачайте pustite.apk и установите на телефон." \
            --latest
