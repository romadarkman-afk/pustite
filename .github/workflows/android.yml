name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/android.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/elevenlabs-tts.yml"
      - ".github/workflows/voiceover-check.yml"
      - "docs/voiceover-setup.md"
      - ".github/run-full-voiceover"
      - "tools/generate_voiceover.py"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 */2 * *'
  workflow_run:
    workflows: ["Полная русская озвучка"]
    types: [completed]

permissions:
  contents: write

# Новая загрузка отменяет ещё идущую старую сборку.
concurrency:
  group: build-${{ github.event_name == 'schedule' && 'signing-cache' || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"
  SIGNING_CERT_SHA256: "38c762a288554dc131760444407ad063a5f8e6278d53cdfccb2ce2d01de0a6be"

jobs:
  keep-signing:
    name: Проверка ключа обновлений
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Восстановить ключ
        id: keepkey
        uses: actions/cache/restore@v5
        with:
          path: ~/debug.keystore
          key: pustite-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Проверить отпечаток ключа
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/debug.keystore" -storepass android 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}')"
          if [ "$actual" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error title=Ключ подписи изменился::Обновление поверх предыдущего APK невозможно. Проверьте ключ."
            exit 1
          fi
          echo "Ключ подписи совпадает с v0.71.17."

  build:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    # Версия сервера закреплена: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26.
    runs-on: ubuntu-24.04
    # Короткая проверка запуска и сборка APK.
    timeout-minutes: 30

    steps:
      - name: Забрать код
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже стоит на серверах GitHub. Сторонний модуль не нужен —
      # он и сломал сборку №2. Ставим сами только то, чего не хватает.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK"
          fi
          echo "SDK: $SDK"

          SDKM=""
          for c in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          if [ -z "$SDKM" ]; then
            echo "Командных инструментов нет — ставлю"
            curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          SUDO=""
          if [ ! -w "$SDK" ]; then SUDO="sudo -E"; fi

          if [ ! -x "$SDK/platform-tools/adb" ] || [ ! -x "$SDK/build-tools/35.0.0/zipalign" ]; then
            yes | $SUDO "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            $SUDO "$SDKM" --sdk_root="$SDK" --install "platform-tools" "build-tools;35.0.0" > /dev/null
          fi

          echo "build-tools на сервере:"; ls "$SDK/build-tools"
          test -x "$SDK/platform-tools/adb" || { echo "Нет adb"; exit 1; }
          ls "$SDK"/build-tools/*/apksigner > /dev/null || { echo "Нет apksigner"; exit 1; }
          echo "APK_BUILD_TOOLS=$SDK/build-tools/35.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Godot ${{ env.GODOT_VERSION }} и шаблоны экспорта
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sfL -o tpl.tpz   "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          unzip -q tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Постоянный отладочный ключ — чтобы новые сборки ставились поверх старых
        id: keycache
        uses: actions/cache@v5
        with:
          path: ~/debug.keystore
          key: pustite-debug-keystore-v1

      - name: Проверка ключа подписи
        run: |
          set -euo pipefail
          if [ "${{ steps.keycache.outputs.cache-hit }}" != "true" ] || [ ! -s "$HOME/debug.keystore" ]; then
            echo "::error title=Ключ подписи отсутствует::Сборка остановлена, чтобы не выпустить несовместимое обновление."
            exit 1
          fi
          actual="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/debug.keystore" -storepass android 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}')"
          if [ "$actual" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error title=Ключ подписи изменился::Сборка остановлена, чтобы не выпустить несовместимое обновление."
            exit 1
          fi
          echo "Ключ подписи совпадает с v0.71.17."

      - name: Настройки редактора Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Загрузить записанные звуки с проверкой контрольных сумм
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[sound-refresh]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[sound-refresh]'))
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 game/tools/refresh_sound_assets.py

      - name: Проверка комплектности папки game
        run: |
          cd game
          if [ ! -f MANIFEST.txt ] || [ ! -f scripts/boot.gd ]; then
            echo "::error title=Старая папка game::В game нет MANIFEST.txt или scripts/boot.gd — загружена старая версия. Удалите папку game на GitHub и загрузите её из последнего архива."
            exit 1
          fi
          grep -v '^#' MANIFEST.txt | sed 's/\r$//' | sort > /tmp/expected.txt
          find . -type f \( -name "*.gd" -o -name "*.tscn" -o -name "*.gdshader" -o -name "*.tres" -o -name "*.json" -o -name "project.godot" -o -name "export_presets.cfg" \) ! -path "./.godot/*" ! -path "./.godot-profile/*" ! -path "./Godot/*" ! -path "./.godot-final-suite*/*" ! -path "./build/*" | sed 's#^\./##' | sort > /tmp/actual.txt
          extra=$(comm -13 /tmp/expected.txt /tmp/actual.txt)
          missing=$(comm -23 /tmp/expected.txt /tmp/actual.txt)
          if [ -n "$extra" ]; then
            echo "::error title=Лишние файлы в game::Остались от старой версии: $(echo $extra). Удалите папку game на GitHub и загрузите её заново целиком."
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Не хватает файлов в game::Не загрузились: $(echo $missing). Загрузите папку game заново целиком."
          fi
          [ -z "$extra" ] && [ -z "$missing" ] || exit 1
          for flag in sim flow layout lifecycle field crowd bubbles marks input hints difficulty howto night eyes lights checkpoint sound village talisman bell events mimic sabotage box roles meeting tunnel diary recap folk loc access daily cosmetics adapt display gestures storage save weather; do
            grep -q -- "\"--$flag\"" scripts/boot.gd || { echo "::error::В scripts/boot.gd нет режима --$flag."; exit 1; }
          done
          echo "Комплект совпадает с описью: $(wc -l < /tmp/expected.txt) файлов"

      - name: Подготовить сжатие иллюстраций
        run: godot --headless --path game --script res://tools/prepare_slide_imports.gd

      - name: Импорт ресурсов
        run: |
          godot --headless --path game --import

      - name: Сохранить обновлённые аудиофайлы в main
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[sound-refresh]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A game/assets/sfx
          if git diff --cached --quiet; then
            echo "Звуковые файлы уже совпадают с проверенными источниками."
          else
            git commit -m "Refresh recorded sound assets"
            git push origin HEAD:main
          fi

      - name: Быстрая проверка запуска
        run: |
          set -o pipefail
          log="$(mktemp)"
          status=0
          timeout 60 godot --headless --path game --quit-after 120 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ] || grep -Eq "SCRIPT ERROR|Parse Error" "$log"; then
            echo "::error title=Быстрая проверка запуска не пройдена::См. вывод Godot выше."
            exit 1
          fi
          echo "Проверка запуска пройдена; перехожу к экспорту APK."
      - name: Проверка вводного обучения и разговоров
        run: |
          set -o pipefail
          log="$(mktemp)"
          status=0
          timeout 60 godot --headless --path game -- --howto 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ] || grep -Eq "SCRIPT ERROR|Parse Error|ИТОГ: НАРУШЕНИЙ" "$log"; then
            echo "::error title=Проверка обучения не пройдена::См. вывод Godot выше."
            exit 1
          fi

      - name: Экспорт, выравнивание и подпись APK
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          preset="game/export_presets.cfg"
          cp "$preset" "$work/export_presets.cfg"
          trap 'cp "$work/export_presets.cfg" "$preset"; rm -rf -- "$work"' EXIT
          # Экспортируем APK без подписи, затем выравниваем ZIP и подписываем итоговый файл.
          sed -i '0,/^package\/signed=true\r\?$/s//package\/signed=false/' "$preset"
          grep -qx 'package/signed=false' "$preset"
          godot --headless --path game --export-debug "Android" "$work/unsigned.apk"
          test -s "$work/unsigned.apk"
          "$APK_BUILD_TOOLS/zipalign" -P 16 -f 4 "$work/unsigned.apk" "$work/aligned.apk"
          mkdir -p build
          "$APK_BUILD_TOOLS/apksigner" sign --ks "$HOME/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out build/pustite.apk "$work/aligned.apk"
          test -s build/pustite.apk

      - name: Проверка APK, подписи и версии
        run: |
          set -euo pipefail
          APK="build/pustite.apk"
          VERSION="$(awk -F '"' '$1 == "config/version=" { print $2; exit }' game/project.godot)"
          VERSION_CODE="$(awk -F= '$1 == "version/code" { print $2; exit }' game/export_presets.cfg)"
          NAME_COUNT="$(awk -F '"' -v v="$VERSION" '$1 == "version/name=" && $2 == v { n++ } END { print n+0 }' game/export_presets.cfg)"
          CODE_COUNT="$(awk -F= -v v="$VERSION_CODE" '$1 == "version/code" && $2 == v { n++ } END { print n+0 }' game/export_presets.cfg)"
          if [ "$NAME_COUNT" -ne 2 ] || [ "$CODE_COUNT" -ne 2 ]; then
            echo "::error title=Версия экспорта не совпадает::Обе Android-настройки должны использовать $VERSION, code $VERSION_CODE."
            exit 1
          fi
          unzip -tq "$APK"
          "$APK_BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          CERTS="$("$APK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERTS"
          ACTUAL_CERT="$(awk '/certificate SHA-256 digest:/ {print tolower($NF)}' <<< "$CERTS" | sort -u)"
          if [ "$ACTUAL_CERT" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error title=Подпись APK не совпадает::Обновление нельзя установить поверх предыдущего релиза."
            exit 1
          fi
          BADGING="$("$APK_BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | sed -n '1,2p'
          EXPECTED="package: name='com.vladi.pustite' versionCode='$VERSION_CODE' versionName='$VERSION'"
          if ! grep -Fq "$EXPECTED" <<< "$BADGING"; then
            echo "::error title=Метаданные APK неверны::Ожидалось: $EXPECTED"
            exit 1
          fi
      - name: Бюджет веса APK
        run: |
          size=$(stat -c %s build/pustite.apk)
          mib=$(awk -v s="$size" 'BEGIN{printf "%.1f", s/1048576}')
          top=$(unzip -lv build/pustite.apk | awk 'NR>3 && $3+0>0 {print $3, $NF}' | sort -rn | head -6 | awk '{printf "%.1f МиБ %s; ", $1/1048576, $2}')
          echo "APK: $size байт, $mib МиБ"
          echo "::notice title=Вес APK::$mib МиБ ($size байт). Крупнейшие записи: $top"
          limit=1000000000  # 1 ГБ: фотореализм, песни и озвучка (решение Влади, 24.10.2026). Было 192 600 000 (v0.62.0 + 15 МиБ). Лимит ассета релиза GitHub: 2 ГБ.
          if [ "$size" -gt "$limit" ]; then
            echo "::error title=APK тяжелее бюджета::$size байт при пределе $limit"
            exit 1
          fi

      - name: Положить APK в артефакты
        uses: actions/upload-artifact@v5
        with:
          name: pustite-apk
          path: build/pustite.apk
          retention-days: 30

      # Релиз идёт с main и по ручному запуску с любой ветки (Actions → Сборка APK → Run workflow).
      # Каждая сильная версия выкладывается как релиз; ветку без PR в main тоже можно выложить,
      # поэтому тег ставится на коммит сборки (--target), а не на голову main.
      - name: Проверить APK из GitHub и опубликовать Latest
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          COMMIT="$(git rev-parse HEAD)"
          VER=$(grep -oP 'config/version="\K[^"]+' game/project.godot)
          SHA256="$(sha256sum build/pustite.apk | cut -d ' ' -f1)"
          {
            echo "Сборка для Android. Коммит ${COMMIT::7}, ветка ${GITHUB_REF_NAME}."
            echo
            awk -v v="## $VER:" 'index($0, v) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md
            printf '\nSHA-256 pustite.apk: `%s`\n' "$SHA256"
          } > release-notes.md
          gh release create "$TAG" "build/pustite.apk" \
            --draft --target "$COMMIT" \
            --title "v$VER · $TAG" \
            --notes-file release-notes.md
          API="repos/$GITHUB_REPOSITORY/releases"
          RELEASE_ID="$(gh api "$API?per_page=30" | jq -er --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag) | .id')"
          ASSET_ID="$(gh api "$API/$RELEASE_ID/assets" --jq '.[] | select(.name == "pustite.apk" and .state == "uploaded") | .id')"
          test -n "$ASSET_ID"
          DOWNLOAD="$(mktemp --suffix=.apk)"
          trap 'rm -f -- "$DOWNLOAD"' EXIT
          gh api -H 'Accept: application/octet-stream' "$API/assets/$ASSET_ID" > "$DOWNLOAD"
          sha256sum build/pustite.apk "$DOWNLOAD"
          if ! cmp -s build/pustite.apk "$DOWNLOAD"; then
            echo '::error::Скачанный из GitHub APK отличается от подписанного файла. Релиз остался черновиком.'
            exit 1
          fi
          "$APK_BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 35 --max-sdk-version 36 "$DOWNLOAD"
          gh api --method PATCH "$API/$RELEASE_ID" -F draft=false -f make_latest=true --silent
          gh api "$API/latest" | jq -e --arg tag "$TAG" --arg digest "sha256:$SHA256" '
            .tag_name == $tag and (.draft | not) and (.prerelease | not)
            and any(.assets[]; .name == "pustite.apk" and .state == "uploaded" and .digest == $digest)'
