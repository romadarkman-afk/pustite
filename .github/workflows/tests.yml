name: Самотесты

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/android.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/gemini-tts.yml"
      - ".github/run-full-voiceover"
      - "tools/generate_voiceover.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новая загрузка отменяет ещё идущие старые проверки той же ветки.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"

jobs:
  tests-fast:
    name: Быстрая проверка
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Импорт ресурсов
        run: godot --headless --path game --import

      - name: Жители, дождь, карта и озвучка
        env:
          CASES: "folk=--folk weather=--weather field=--field village=--village voice=--voice-assets"
          CASE_TIMEOUT: "180"
        run: bash tools/ci_run_cases.sh $CASES

  tests-full:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Набор с пометкой known: true показывал бы проблему, не краснив всю проверку (сейчас таких нет).
    continue-on-error: ${{ matrix.known == true }}
    strategy:
      # Упавший набор не отменяет остальные: видно сразу все поломки.
      fail-fast: false
      matrix:
        include:
          - name: Основные 1
            cases: "sim=--sim story=--story chapters=--chapters flow=--flow lifecycle=--lifecycle field=--field crowd=--crowd bubbles=--bubbles marks=--marks input=--input hints=--hints difficulty=--difficulty howto=--howto night=--night eyes=--eyes lights=--lights checkpoint=--checkpoint sound=--sound village=--village"
          - name: Основные 2
            cases: "talisman=--talisman bell=--bell events=--events mimic=--mimic sabotage=--sabotage box=--box roles=--roles meeting=--meeting tunnel=--tunnel diary=--diary recap=--recap folk=--folk loc=--loc access=--access daily=--daily cosmetics=--cosmetics adapt=--adapt display=--display gestures=--gestures candle=--candle haptics=--haptics portraits=--portraits tension=--tension doors=--doors emptying=--emptying pairs=--pairs themes=--themes soundmaps=--soundmaps actscenes=--actscenes campmap=--campmap slides=--slides achicons=--achicons parallax=--parallax traces=--traces storage=--storage save=--save weather=--weather perf=--perf debugmenu=--debugmenu release=--release"
          - name: Раскладка ru en
            cases: "layout_ru=--layout,--lang=ru layout_ru_t2=--layout,--lang=ru,--text=2 layout_en=--layout,--lang=en layout_en_t2=--layout,--lang=en,--text=2 crowd_ru=--crowd,--lang=ru crowd_en=--crowd,--lang=en"
          - name: Раскладка de fr
            cases: "layout_de=--layout,--lang=de layout_de_t2=--layout,--lang=de,--text=2 layout_fr=--layout,--lang=fr layout_fr_t2=--layout,--lang=fr,--text=2 crowd_de=--crowd,--lang=de crowd_fr=--crowd,--lang=fr"
          - name: Раскладка es pt
            cases: "layout_es=--layout,--lang=es layout_es_t2=--layout,--lang=es,--text=2 layout_pt=--layout,--lang=pt layout_pt_t2=--layout,--lang=pt,--text=2 crowd_pt=--crowd,--lang=pt crowd_es=--crowd,--lang=es"
          - name: Раскладка tr hi
            cases: "layout_tr=--layout,--lang=tr layout_tr_t2=--layout,--lang=tr,--text=2 layout_hi=--layout,--lang=hi layout_hi_t2=--layout,--lang=hi,--text=2 crowd_tr=--crowd,--lang=tr crowd_hi=--crowd,--lang=hi"
          - name: Раскладка vi zh
            cases: "layout_vi=--layout,--lang=vi layout_vi_t2=--layout,--lang=vi,--text=2 layout_zh=--layout,--lang=zh layout_zh_t2=--layout,--lang=zh,--text=2 crowd_vi=--crowd,--lang=vi crowd_zh=--crowd,--lang=zh"

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Импорт ресурсов
        run: |
          godot --headless --path game --import
          godot --headless --path game --import

      - name: Прогон набора
        env:
          CASES: ${{ matrix.cases }}
          CASE_TIMEOUT: "320"
        run: |
          # shellcheck disable=SC2086
          bash tools/ci_run_cases.sh $CASES

  # Страница магазина (TASK-098): длины текстов, размеры картинок, сверка чисел с игрой, политика.
  store:
    name: Страница магазина
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Зависимости
        run: pip install pillow markdown

      - name: Проверка страницы магазина
        run: python3 tools/check_store.py

  # Отрисовка (аудит F-07): самотесты идут без видеодрайвера и не видят ошибок шейдеров, текстур и пустых экранов.
  # Здесь меню, день, ночь у двери и карта кампании снимаются в Xvfb на программном OpenGL, как на странице магазина.
  render:
    name: Отрисовка
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Видеодрайвер и зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libxcursor1 libxi6 libxrandr2 libxinerama1 libxkbcommon0 libasound2t64
          pip install pillow

      - name: Импорт ресурсов
        run: |
          godot --headless --path game --import
          godot --headless --path game --import

      - name: Съёмка кадров
        run: |
          mkdir -p build/shots
          RES=720x1280 SHOT_TIMEOUT=900 GODOT=godot bash tools/store_shots.sh build/shots ru \
            r1_menu:menu r2_day:day:a1c3 r3_door:door:a3c1 r4_camp:camp 2>&1 | tee build/shots.log

      - name: Проверка кадров
        run: |
          python3 tools/check_render.py --self-test
          python3 tools/check_render.py build/shots build/shots.log 720 1280 r1_menu r2_day r3_door r4_camp

      - name: Кадры в артефакты
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: render-shots
          path: |
            build/shots/*.png
            build/shots.log
          retention-days: 7
