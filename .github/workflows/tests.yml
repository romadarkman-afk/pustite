name: Самотесты

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новая загрузка отменяет ещё идущие старые проверки той же ветки.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Набор с пометкой known показывает проблему, но не краснит всю проверку.
    continue-on-error: ${{ matrix.known == true }}
    strategy:
      # Упавший набор не отменяет остальные: видно сразу все поломки.
      fail-fast: false
      matrix:
        include:
          - name: Основные 1
            cases: "sim=--sim flow=--flow lifecycle=--lifecycle field=--field crowd=--crowd bubbles=--bubbles marks=--marks input=--input hints=--hints difficulty=--difficulty howto=--howto night=--night eyes=--eyes lights=--lights checkpoint=--checkpoint sound=--sound village=--village"
          - name: Основные 2
            cases: "talisman=--talisman bell=--bell events=--events mimic=--mimic sabotage=--sabotage box=--box roles=--roles meeting=--meeting tunnel=--tunnel diary=--diary recap=--recap folk=--folk loc=--loc access=--access daily=--daily cosmetics=--cosmetics adapt=--adapt display=--display gestures=--gestures candle=--candle haptics=--haptics portraits=--portraits tension=--tension doors=--doors emptying=--emptying storage=--storage save=--save weather=--weather"
          - name: Раскладка ru en
            cases: "layout_ru=--layout,--lang=ru layout_ru_t2=--layout,--lang=ru,--text=2 layout_en=--layout,--lang=en layout_en_t2=--layout,--lang=en,--text=2 crowd_ru=--crowd,--lang=ru crowd_en=--crowd,--lang=en"
          - name: Раскладка de fr
            cases: "layout_de=--layout,--lang=de layout_de_t2=--layout,--lang=de,--text=2 layout_fr=--layout,--lang=fr layout_fr_t2=--layout,--lang=fr,--text=2 crowd_de=--crowd,--lang=de"
          - name: Раскладка es pt
            cases: "layout_es=--layout,--lang=es layout_es_t2=--layout,--lang=es,--text=2 layout_pt=--layout,--lang=pt layout_pt_t2=--layout,--lang=pt,--text=2 crowd_pt=--crowd,--lang=pt"
          - name: Раскладка tr hi
            cases: "layout_tr=--layout,--lang=tr layout_tr_t2=--layout,--lang=tr,--text=2 layout_hi=--layout,--lang=hi layout_hi_t2=--layout,--lang=hi,--text=2 crowd_tr=--crowd,--lang=tr crowd_hi=--crowd,--lang=hi"
          - name: Известная проблема, не блокирует
            known: true
            cases: "crowd_es=--crowd,--lang=es crowd_fr=--crowd,--lang=fr"
          - name: Раскладка vi zh
            cases: "layout_vi=--layout,--lang=vi layout_vi_t2=--layout,--lang=vi,--text=2 layout_zh=--layout,--lang=zh layout_zh_t2=--layout,--lang=zh,--text=2 crowd_vi=--crowd,--lang=vi crowd_zh=--crowd,--lang=zh"

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Импорт ресурсов
        run: |
          godot --headless --path game --import
          godot --headless --path game --import

      - name: Прогон набора
        env:
          CASES: ${{ matrix.cases }}
          CASE_TIMEOUT: "200"
        run: |
          # shellcheck disable=SC2086
          bash tools/ci_run_cases.sh $CASES
