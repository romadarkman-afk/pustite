name: Полная русская озвучка

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/run-full-voiceover"

permissions:
  contents: write

concurrency:
  group: elevenlabs-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Сюжет и игровые реакции
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[voiceover-run]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Забрать код
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Проверить секрет ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::error title=Не задан ELEVENLABS_API_KEY::Добавьте ключ в Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Подготовить ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Проверить план пакета
        run: python3 tools/generate_voiceover.py --self-test

      - name: Настроить запись результатов в main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Создать и проверить полный пакет озвучки
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MAX_WORKERS: "3"
        run: python3 tools/generate_voiceover.py
